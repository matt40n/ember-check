# Twice a week in fire season (Mon/Thu 06:00 PT), weekly otherwise: re-check every tracked order against
# its agency page. Entries that pass get a fresh verifiedOn stamp (which is what keeps the map from greying
# out after 14 days); anything that warns or fails becomes an issue assigned to the maintainer, who gets
# an email from GitHub for it.
name: Verify fire orders

on:
  schedule:
    - cron: '0 13 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify orders (stamp passing entries)
        id: verify
        run: |
          set +e -o pipefail
          bun run scripts/verify-orders.ts --stamp --json verify.json | tee verify.log
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Refresh campground page links and open/closed status
        run: bun run scripts/enrich-sites.ts
      - name: Typecheck after stamping
        run: bunx tsc
      - name: Commit stamps
        id: commit
        run: |
          git config user.name 'ember-check bot'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet src/data/restrictions.ts public/data/site-pages.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git add src/data/restrictions.ts public/data/site-pages.json
          git commit -m "verify: stamp verifiedOn, refresh site pages $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update issue for WARN/FAIL
        if: steps.verify.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: bash .github/scripts/verify-issue.sh
      - name: Report bot failure itself
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-issue.sh "Ember Check: verify bot is failing" "$(cat .github/issue-templates/verify-bot-failing.md)

          Run: $RUN_URL" bot
  deploy:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
