# Daily: is the live site up, and is its data still fresh? Emails (via an assigned issue) 4 days before
# the app would start greying orders out, and again if the site itself is unreachable.
name: Site health

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ASSIGNEE: ${{ github.repository_owner }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch status.json
        id: status
        run: |
          if ! curl -fsSL --max-time 30 "$SITE/status.json" -o status.json; then
            echo "down=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "down=false" >> "$GITHUB_OUTPUT"
          # Compute ages here, from dates — the file's own age fields are frozen at build time
          oldest=$(jq -r .oldestVerifiedOn status.json); generated=$(jq -r .generatedAt status.json)
          echo "age=$(( ( $(date -u +%s) - $(date -u -d "$oldest" +%s) ) / 86400 ))" >> "$GITHUB_OUTPUT"
          echo "buildage=$(( ( $(date -u +%s) - $(date -u -d "${generated%%T*}" +%s) ) / 86400 ))" >> "$GITHUB_OUTPUT"
          echo "generated=$generated" >> "$GITHUB_OUTPUT"
          echo "expiring=$(jq -r '.expiringWithin14Days | map("\(.name) (\(.expires))") | join(", ")' status.json)" >> "$GITHUB_OUTPUT"
          cat status.json
      - name: Site down
        if: steps.status.outputs.down == 'true'
        run: |
          bash .github/scripts/upsert-issue.sh "Ember Check: site unreachable" "$(cat .github/issue-templates/site-down.md)

          Site: $SITE" bot
      - name: Data going stale
        if: steps.status.outputs.down == 'false' && fromJSON(steps.status.outputs.age) >= 10
        env:
          AGE: ${{ steps.status.outputs.age }}
          GENERATED: ${{ steps.status.outputs.generated }}
        run: |
          bash .github/scripts/upsert-issue.sh "Ember Check: order data going stale" "$(cat .github/issue-templates/data-stale.md)

          Oldest verifiedOn age: $AGE days · site built $GENERATED" bot
      - name: Site not rebuilt in 6 days (verify bot not committing?)
        if: steps.status.outputs.down == 'false' && fromJSON(steps.status.outputs.buildage) >= 6
        env:
          BUILDAGE: ${{ steps.status.outputs.buildage }}
        run: |
          bash .github/scripts/upsert-issue.sh "Ember Check: verify bot has not published in days" "$(cat .github/issue-templates/data-stale.md)

          The live site was last built $BUILDAGE days ago. The verify bot should commit and redeploy twice a week; check the Actions tab for a failing or disabled workflow (GitHub disables scheduled workflows after 60 days without a push)." bot
      - name: Orders expiring soon (info only, no email)
        if: steps.status.outputs.expiring != ''
        env:
          EXPIRING: ${{ steps.status.outputs.expiring }}
        run: echo "Expiring within 14 days — $EXPIRING (the verify bot flags the replacement order when it appears)"
